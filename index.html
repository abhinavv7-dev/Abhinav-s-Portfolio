<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    
    <title>Abhinav Prasad — Builder • Developer • Problem Solver</title>
    <meta name="description" content="Portfolio of Abhinav Prasad — Computer Science Engineering student, backend developer, and AI enthusiast crafting modern software solutions." />
    
    <!-- Preconnect to Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Inline Theme Initializer to prevent Flash of Unstyled Content -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('abhinav_portfolio_theme');
          if (storedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', 'light dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', 'dark light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
